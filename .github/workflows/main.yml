name: Python Autoformat Lint

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  lint:
    name: Autoformat + Lint
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 yt-dlp

      # 4️⃣ Autoformat with Black
      - name: Autoformat with Black
        run: |
          echo "💅 Running Black autoformatter..."
          black .

      # 5️⃣ Lint with Flake8 (non-blocking)
      - name: Lint with Flake8
        continue-on-error: true
        run: |
          echo "🔍 Running Flake8 (non-blocking)..."
          flake8 .
